worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Upstream
    upstream backend {
        least_conn;
        server backend:3000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────
    server {
        listen 80;
        server_name therealinside.com www.therealinside.com therealaside.com www.therealaside.com;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS — therealinside.com ────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name therealinside.com www.therealinside.com;

        ssl_certificate     /etc/letsencrypt/live/therealinside.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/therealinside.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000";

        # Gzip
        gzip on;
        gzip_types text/plain application/json application/javascript text/css image/svg+xml;

        # API routes — proxy to Node.js backend
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn 20;
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;

            # Intercept errors to return JSON instead of HTML
            proxy_intercept_errors on;
            error_page 502 503 504 /api-error.json;
        }

        # Auth routes — stricter rate limit
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Intercept errors to return JSON instead of HTML
            proxy_intercept_errors on;
            error_page 502 503 504 /api-error.json;
        }

        # Custom JSON error page for 502/503/504 errors on API
        location = /api-error.json {
            default_type application/json;
            return 502 '{"success": false, "message": "Our server is temporarily down. Please try after some time or WhatsApp us at +91-9636964462" }';
        }

        # Health check
        location /health {
            proxy_pass http://backend:3000;
        }

        location /api/health {
            proxy_pass http://backend:3000;
            proxy_intercept_errors on;
            error_page 502 503 504 /api-error.json;
        }

        # HTML pages: never cache — always re-validate so browsers pick up
        # new JS/CSS versions immediately after deployment
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        # JS and CSS: no-cache so query-string cache-busting (?v=X.Y) works
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-cache, must-revalidate";
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        # Images and fonts: long cache (content-addressed, rarely changes)
        location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, must-revalidate";
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        # Frontend — catch-all
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }

    # ── HTTP — therealaside.com ──────────────────────────────────────────
    server {
        listen 80;
        server_name therealaside.com www.therealaside.com;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # API routes — proxy to Node.js backend
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;

            # Intercept errors to return JSON instead of HTML
            proxy_intercept_errors on;
            error_page 502 503 504 /api-error.json;
        }

        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Intercept errors to return JSON instead of HTML
            proxy_intercept_errors on;
            error_page 502 503 504 /api-error.json;
        }

        # Custom JSON error page for 502/503/504 errors on API
        location = /api-error.json {
            default_type application/json;
            return 502 '{"success": false, "message": "Our server is temporarily down. Please try after some time or WhatsApp us at +91-9636964462" }';
        }

        location /api/health {
            proxy_pass http://backend:3000;
            proxy_intercept_errors on;
            error_page 502 503 504 /api-error.json;
        }

        # HTML: no cache
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        # JS and CSS: no-cache with cache-busting via query strings
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-cache, must-revalidate";
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        # Images and fonts: long cache
        location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, must-revalidate";
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        # Frontend catch-all
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
